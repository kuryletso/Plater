[project]
name = "Plater"
version = "1.0.0"
description = "Generate invoices from custom templates."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "babel>=2.18.0",
    "lxml>=6.1.1",
    "num2words>=0.5.14",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pyside6-essentials>=6.11.1",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["I001"]
