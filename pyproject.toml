[project]
name = "Plater"
version = "0.1.0"
description = "Generate invoices from custom templates."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "lxml>=6.1.1",
    "num2words>=0.5.14",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.49",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["I001"]