# Builds, checks and publishes a release when a vresion tag is pushed:
#   git tag v1.0.0
#   git push origin v1.0.0
# The tag must match the version in pyproject.toml
name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write     # to create the release


jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: astral-sh/setup-uv@v6
              with:
                python-version: "3.13"

            - run: uv sync --locked

            - name: Check the tag against pyproject.toml
              shell: bash
              run: |
                version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'], end='')")
                if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::The tag is $GITHUB_REF_NAME but pyproject.toml says $version"
                    exit 1
                fi

            - run: uv run python scripts/build_ui.py

            - run: uv run pytest -q

            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y

            - run: uv run python scripts/build_app.py

            - run: uv run python scripts/smoke_app.py

            # a fixed asset name, so .../releases/latest/download/Plater-Setup.exe always servers the newset installer
            - name: Publish the release
              shell: bash
              env:
                GH_TOKEN: ${{ github.token }}
              run: >
                gh release create "$GITHUB_REF_NAME" dist/Plater-Setup.exe
                --title "Plater ${GITHUB_REF_NAME#v}"
                --generate-notes